<style>
:root {
  --bg: #f6f5f1;
  --surface: #ffffff;
  --surface-2: #efede7;
  --text: #16181d;
  --muted: #5b606b;
  --faint: #8a8f99;
  --line: #e1dfd8;
  --accent: #3a4fd6;
  --accent-soft: #e4e7fb;
  --accent-text: #2a3cb8;
  --good: #1f7a4d;
  --good-soft: #e0f1e8;
  --warn: #9a6200;
  --warn-soft: #f7ecd6;
  --shadow: 0 1px 2px rgba(20, 20, 30, .04), 0 4px 16px rgba(20, 20, 30, .04);
  /* Cores por tipo de stack */
  --k-back: #1b8a52; --k-front: #2f62d8; --k-data: #a86400; --k-arch: #6c47d9; --k-test: #0e8584;
  --k-obs: #b5378f; --k-int: #0a7ca6; --k-tools: #5c6570; --k-ai: #d0442c; --k-cloud: #5e7c0a;
  --nav-h: 60px;
  --sans: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --surface: #161920; --surface-2: #1c2029; --text: #e7e8ec; --muted: #a0a5b0; --faint: #717785;
    --line: #262a33; --accent: #8c9bff; --accent-soft: #232a4d; --accent-text: #aab5ff;
    --good: #5fd49a; --good-soft: #17301f; --warn: #f0b95a; --warn-soft: #33280f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    --k-back: #5fd49a; --k-front: #83a8ff; --k-data: #f0b95a; --k-arch: #b49bff; --k-test: #4fd1c5;
    --k-obs: #ee8fd3; --k-int: #62d2ef; --k-tools: #a3aab6; --k-ai: #ff8f7a; --k-cloud: #b5d65a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1115; --surface: #161920; --surface-2: #1c2029; --text: #e7e8ec; --muted: #a0a5b0; --faint: #717785;
  --line: #262a33; --accent: #8c9bff; --accent-soft: #232a4d; --accent-text: #aab5ff;
  --good: #5fd49a; --good-soft: #17301f; --warn: #f0b95a; --warn-soft: #33280f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  --k-back: #5fd49a; --k-front: #83a8ff; --k-data: #f0b95a; --k-arch: #b49bff; --k-test: #4fd1c5;
  --k-obs: #ee8fd3; --k-int: #62d2ef; --k-tools: #a3aab6; --k-ai: #ff8f7a; --k-cloud: #b5d65a;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 1rem/1.6 var(--sans); -webkit-font-smoothing: antialiased;
  padding-inline: max(20px, env(safe-area-inset-left, 0px));
}
a { color: inherit; }
h1, h2, h3, h4 { line-height: 1.2; margin: 0; letter-spacing: -.015em; }
p { margin: 0; }
ul { margin: 0; padding: 0; list-style: none; }
/* Largura do conteúdo em %: acompanha o tamanho da tela, com um teto para leitura confortável */
:root { --content: min(100%, 1080px); }
@media (min-width: 1280px) { :root { --content: 86%; } }
@media (min-width: 1680px) { :root { --content: 82%; } html { font-size: 17px; } }
@media (min-width: 2200px) { :root { --content: min(78%, 2000px); } html { font-size: 18px; } }
.wrap { width: var(--content); max-width: 100%; margin-inline: auto; }
.mono { font-family: var(--mono); font-size: .82em; letter-spacing: 0; }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 12px; z-index: 100; background: var(--surface); padding: 8px 12px; border-radius: 8px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ---------- Navegação ---------- */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.nav-in { width: var(--content); max-width: 100%; margin: 0 auto; padding: 0 20px; height: var(--nav-h); display: flex; align-items: center; gap: 20px; }
.brand { font-weight: 700; font-size: .95rem; letter-spacing: -.01em; text-decoration: none; white-space: nowrap; }
.brand:hover { color: var(--accent-text); }
.progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; pointer-events: none; }
.progress i { display: block; height: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }

/* Seletor de idioma */
.lang { position: relative; }
.lang-btn {
  display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 10px 0 8px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text);
  font: 600 .74rem var(--mono); letter-spacing: .04em;
}
.lang-btn > svg { width: 12px; height: 12px; color: var(--muted); transition: transform .2s; }
.lang-btn[aria-expanded="true"] > svg { transform: rotate(180deg); }
.flag { display: inline-flex; width: 21px; height: 15px; border-radius: 3px; overflow: hidden; flex: none; box-shadow: 0 0 0 1px rgba(0, 0, 0, .12); }
.flag svg { width: 100%; height: 100%; display: block; }
.lang-menu {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 180px; padding: 6px; z-index: 60;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 12px 32px rgba(0, 0, 0, .14);
  animation: pop .16s ease-out;
}
.lang-menu li {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; font-size: .9rem; outline: none;
}
.lang-menu li:hover, .lang-menu li:focus { background: var(--surface-2); }
.lang-menu li[aria-selected="true"] { font-weight: 600; }
.lang-menu .check { width: 14px; height: 14px; margin-left: auto; color: var(--accent-text); }
@keyframes pop { from { opacity: 0; transform: translateY(-4px) scale(.98); } }
.links { display: flex; gap: 2px; margin-inline: auto; }
.links a {
  text-decoration: none; color: var(--muted); font-size: .86rem; padding: 6px 10px; border-radius: 999px; white-space: nowrap;
  transition: color .15s, background .15s;
}
.links a:hover { color: var(--text); }
.links a.on { color: var(--accent-text); background: var(--accent-soft); }
.ctrls { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.links + .ctrls { margin-left: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--surface); }
.seg button {
  font: 600 .72rem var(--mono); letter-spacing: .04em; border: 0; background: none; color: var(--muted);
  padding: 5px 9px; border-radius: 999px; cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.icon-btn {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--text);
}
.icon-btn svg { width: 16px; height: 16px; }
@media (max-width: 1100px) {
  :root { --nav-h: 56px; --nav-links-h: 44px; }
  /* Linha 1: nome + controles nas pontas · Linha 2: links roláveis na horizontal */
  .nav-in { display: grid; grid-template-columns: minmax(0, 1fr) auto; height: auto; padding: 0; gap: 0; max-width: none; }
  .brand { height: var(--nav-h); display: flex; align-items: center; padding-left: 20px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .ctrls, .links + .ctrls { height: var(--nav-h); padding-right: 20px; margin-left: 0; justify-self: end; }
  .links {
    grid-column: 1 / -1; grid-row: 2; height: var(--nav-links-h); align-items: center; overflow-x: auto; scrollbar-width: none;
    padding: 0 16px; border-top: 1px solid var(--line); margin: 0; gap: 4px; scroll-padding-inline: 16px;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0, #000 16px, #000 calc(100% - 24px), transparent 100%);
  }
  .links::-webkit-scrollbar { display: none; }
  .links a { font-size: .84rem; padding: 6px 11px; }
}
@media (max-width: 420px) {
  .brand { font-size: .88rem; padding-left: 16px; }
  .ctrls, .links + .ctrls { padding-right: 16px; gap: 6px; }
  .lang-btn { padding: 0 8px 0 7px; gap: 5px; }
}

/* ---------- Estrutura de seções ---------- */
main { overflow-x: clip; padding-top: calc(var(--nav-h) + var(--nav-links-h, 0px) + env(safe-area-inset-top, 0px)); }
section { scroll-margin-top: calc(var(--nav-h) + var(--nav-links-h, 0px) + 16px); }
.sec { padding-block: 40px; border-top: 1px solid var(--line); display: grid; gap: 28px; }
.sec > * { min-width: 0; } /* impede carrosséis de alargarem a coluna */
@media (min-width: 900px) {
  .sec { grid-template-columns: clamp(200px, 16%, 280px) 1fr; gap: clamp(44px, 4%, 80px); padding-block: 52px; }
  .sec-h { position: sticky; top: calc(var(--nav-h) + var(--nav-links-h, 0px) + 28px); align-self: start; }
}
.sec-n { font-family: var(--mono); font-size: .78rem; color: var(--accent-text); display: block; margin-bottom: 8px; }
.sec-h h2 { font-size: 1.55rem; }
.sec-h p { color: var(--muted); font-size: .9rem; margin-top: 10px; }
.sub { font-size: .74rem; font-family: var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; margin: 0 0 12px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; box-shadow: var(--shadow); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: 500 .76rem/1 var(--mono); padding: 6px 9px; border-radius: 7px; background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--line);
}
[data-k="back"] { --k: var(--k-back); } [data-k="front"] { --k: var(--k-front); } [data-k="data"] { --k: var(--k-data); }
[data-k="arch"] { --k: var(--k-arch); } [data-k="test"] { --k: var(--k-test); } [data-k="obs"] { --k: var(--k-obs); }
[data-k="int"] { --k: var(--k-int); } [data-k="tools"] { --k: var(--k-tools); } [data-k="ai"] { --k: var(--k-ai); }
[data-k="cloud"] { --k: var(--k-cloud); }
.chip[data-k] {
  color: var(--k); font-weight: 600;
  background: color-mix(in srgb, var(--k) 10%, var(--surface));
  border-color: color-mix(in srgb, var(--k) 30%, var(--surface));
}
.pill { display: inline-flex; align-items: center; gap: 6px; font: 600 .7rem/1 var(--mono); padding: 5px 8px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.on { color: var(--good); background: var(--good-soft); }
.pill.study { color: var(--warn); background: var(--warn-soft); }
.pill.off { color: var(--faint); background: var(--surface-2); }

/* ---------- Animações ---------- */
.rv {
  opacity: 0; transform: translateY(22px);
  transition: opacity .8s cubic-bezier(.2, .7, .2, 1), transform .8s cubic-bezier(.2, .7, .2, 1);
  transition-delay: var(--d, 0ms);
}
.rv.in { opacity: 1; transform: none; }
.rv .bar, .rv .meter i { transform-origin: left; transform: scaleX(0); transition: transform 1.1s cubic-bezier(.2, .7, .2, 1) calc(var(--d, 0ms) + 200ms); }
.rv.in .bar, .rv.in .meter i { transform: scaleX(1); }
.rv.now, .rv.now .bar, .rv.now .meter i { transition: none; }
.intro .hero .a { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: calc(var(--i) * 110ms + 80ms); }
@keyframes rise { from { opacity: 0; transform: translateY(26px); } }
.glow {
  position: absolute; z-index: -1; width: 620px; height: 620px; right: -160px; top: -120px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent) 26%, transparent), transparent 62%),
              radial-gradient(circle at 70% 70%, color-mix(in srgb, var(--good) 16%, transparent), transparent 58%);
  filter: blur(30px); animation: drift 16s ease-in-out infinite alternate;
}
@keyframes drift { to { transform: translate(-90px, 70px) scale(1.12) rotate(25deg); } }
.card, .cat, .clinks a { transition: transform .25s ease, border-color .2s, box-shadow .25s, opacity .8s cubic-bezier(.2, .7, .2, 1); }
.card.rv, .cat.rv, .clinks a.rv { transition: opacity .8s cubic-bezier(.2, .7, .2, 1) var(--d, 0ms), transform .8s cubic-bezier(.2, .7, .2, 1) var(--d, 0ms), border-color .2s, box-shadow .25s; }
@media (hover: hover) {
  .card.in:hover, .clinks a.in:hover { transform: translateY(-3px); transition-delay: 0ms; box-shadow: 0 10px 30px rgba(20, 20, 40, .08); }
  .chip { transition: color .15s, border-color .15s, background .15s; }
  .chip:not([data-k]):hover { color: var(--accent-text); border-color: var(--accent); background: var(--accent-soft); }
  .chip[data-k]:hover { background: color-mix(in srgb, var(--k) 20%, var(--surface)); border-color: var(--k); }
  .srow:not(.head):hover .sname { color: var(--accent-text); }
}
.job.current .job-body::after {
  content: ""; position: absolute; left: -6px; top: 5px; width: 11px; height: 11px; border-radius: 50%;
  box-shadow: 0 0 0 0 var(--accent); animation: ping 2.4s ease-out infinite;
}
@keyframes ping { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 80%, 100% { box-shadow: 0 0 0 12px transparent; } }
.hero .kicker .dot { animation: breathe 2.4s ease-in-out infinite; }
@keyframes breathe { 50% { box-shadow: 0 0 0 7px var(--good-soft); } }
@media (prefers-reduced-motion: reduce) {
  .rv, .rv .bar, .rv .meter i { opacity: 1; transform: none; transition: none; }
  .intro .hero .a, .glow, .job.current .job-body::after, .hero .kicker .dot { animation: none; }
}

/* ---------- Abertura ---------- */
.hero { padding-block: 28px 40px; position: relative; isolation: isolate; }
.hero .role .sep { color: var(--faint); }
@media (min-width: 900px) { .hero { padding-block: 44px 52px; } }
.hero .kicker { font-family: var(--mono); font-size: .82rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; }
.hero .kicker .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 4px var(--good-soft); }
.hero h1 { font-size: clamp(2.5rem, 7.2vw, 5rem); letter-spacing: -.035em; line-height: 1.02; margin-top: 16px; font-weight: 750; }
.hero h1 .last { color: var(--faint); }
.hero .role { font-size: clamp(1.05rem, 2.2vw, 1.3rem); margin-top: 18px; color: var(--muted); }
.hero .role strong { color: var(--text); font-weight: 600; }
.hero .tagline { font-size: clamp(1.25rem, 2.8vw, 1.7rem); margin-top: 26px; max-width: 30ch; line-height: 1.3; letter-spacing: -.02em; font-weight: 500; }
.hero .tagline em { font-style: normal; color: var(--accent-text); }
.cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 34px; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 600; font-size: .92rem;
  padding: 11px 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); transition: transform .15s, border-color .15s;
}
.btn:hover { transform: translateY(-1px); border-color: var(--faint); }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn svg { width: 16px; height: 16px; }
.hero-edu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 28px; max-width: 820px; }
.hero-edu a {
  display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 14px; text-decoration: none;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: border-color .2s, transform .2s;
}
.hero-edu a:hover { border-color: var(--accent); transform: translateY(-2px); }
.hero-edu .ic { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent-text); }
.hero-edu .ic svg { width: 20px; height: 20px; }
.hero-edu small { display: block; font: 700 .68rem var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--good); margin-bottom: 3px; }
.hero-edu small.now { color: var(--warn); }
.hero-edu b { display: block; font-size: .98rem; line-height: 1.3; }
.hero-edu span { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
@media (max-width: 640px) { .hero-edu { grid-template-columns: 1fr; } }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; margin-top: 32px; background: var(--line); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
.stat { background: var(--surface); padding: 20px 22px; }
.stat b { display: block; font-size: 1.2rem; line-height: 1.3; letter-spacing: -.02em; font-weight: 700; }
.stat span { display: block; margin-top: 4px; color: var(--muted); font-size: .84rem; line-height: 1.45; }
@media (max-width: 720px) { .stats { grid-template-columns: 1fr; } }

.hero .kicker .klang { display: inline-flex; align-items: center; gap: 7px; }
.hero .kicker .klang .flag { width: 18px; height: 13px; }

/* ---------- Idiomas ---------- */
.langs { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.langs li { display: flex; gap: 16px; align-items: flex-start; }
.flag.big { width: 42px; height: 30px; border-radius: 5px; margin-top: 2px; }
.langs h3 { font-size: 1.1rem; }
.lvl { display: flex; align-items: center; gap: 10px; margin-top: 6px; font: 600 .8rem var(--mono); color: var(--accent-text); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 18px; height: 6px; border-radius: 3px; background: var(--surface-2); }
.dots i.on { background: var(--accent); }
.ldesc { color: var(--muted); font-size: .9rem; margin-top: 8px; }

/* ---------- Quem sou ---------- */
.about p { font-size: 1.08rem; color: var(--muted); }
.about p + p { margin-top: 18px; }
.about p:first-child { color: var(--text); font-size: 1.22rem; line-height: 1.5; }

/* ---------- Experiência ---------- */
.jobs { display: grid; gap: 0; }
.job { position: relative; padding-bottom: 36px; }
.job:last-child { padding-bottom: 0; }
.job-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 10px; font: .78rem var(--mono); color: var(--muted); }
.job-meta .when { color: var(--text); font-weight: 600; }
.job-meta .dur { color: var(--accent-text); background: var(--accent-soft); padding: 3px 9px; border-radius: 999px; font-weight: 600; }
.job-meta .place::before { content: "·"; margin-right: 10px; color: var(--faint); }
.job-body { border-left: 1px solid var(--line); padding-left: 24px; position: relative; }
.job-body::before { content: ""; position: absolute; left: -6px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--bg); border: 2px solid var(--accent); }
.job.current .job-body::before { background: var(--accent); }
.job h3 { font-size: 1.3rem; }
.job .role-t { color: var(--muted); margin-top: 4px; }

/* Gestão */

@media (max-width: 680px) {
  .srow { grid-template-columns: 1fr auto; grid-template-areas: "name dur" "track track"; gap: 8px 10px; padding: 12px 0; }

  .srow .track { grid-area: track; }
  .srow .sdur { grid-area: dur; text-align: right; }
}

/* ---------- Habilidades ---------- */
.skills-block { margin-top: 36px; }
.blk { font-size: 1.15rem; margin-bottom: 18px; }

.soft-chip { display: inline-flex; align-items: center; gap: 5px; color: var(--text); background: var(--surface-2); font-family: var(--sans); font-weight: 500; font-size: .8rem !important; }
.soft-chip svg { width: 12px; height: 12px; color: var(--good); }

/* ---------- Formação ---------- */
.edu { display: grid; gap: 20px; }
.edu .top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 10px 16px; }

button.btn { font: inherit; font-weight: 600; font-size: .92rem; color: inherit; cursor: pointer; }
button.btn.primary { color: var(--bg); }

.stages { counter-reset: st; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 8px; margin-top: 18px; }
.stages li { counter-increment: st; font-size: .88rem; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); display: flex; gap: 10px; }

/* ---------- Cursos ---------- */

.cat { background: color-mix(in srgb, var(--k, var(--accent)) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--k, var(--accent)) 34%, var(--surface)); border-top: 3px solid var(--k, var(--accent)); border-radius: 14px; overflow: hidden; }

}

}

.fabs {

  right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
}

.intro ~ .fabs { animation: rise .6s 1.2s both; }
@media print { .fabs { display: none !important; } }

footer { border-top: 1px solid var(--line); padding-block: 28px calc(28px + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font: .78rem var(--mono); color: var(--faint); }

</style>

const t = x => x == null ? '' : typeof x === 'string' ? x : (x[lang] ?? x.pt);
const parseYM = s => { const [y, m] = s.split('-').map(Number); return { y, m }; };
const now = () => new Date();

// Meses decorridos desde o 1º dia de `start` até hoje (ou até o fim do mês `end`, inclusivo)
function monthsBetween(start, end) {
  const a = parseYM(start);
  if (end) { const b = parseYM(end); return (b.y - a.y) * 12 + (b.m - a.m) + 1; }
  const n = now();
  return Math.max(0, (n.getFullYear() - a.y) * 12 + (n.getMonth() + 1 - a.m));
}

function fmtDur(mo) {
  const y = Math.floor(mo / 12), m = mo % 12;
  const W = {
    pt: [n => n === 1 ? 'ano' : 'anos', n => n === 1 ? 'mês' : 'meses', ' e ', 'menos de 1 mês'],
    en: [n => n === 1 ? 'year' : 'years', n => n === 1 ? 'month' : 'months', ', ', 'less than a month'],
    es: [n => n === 1 ? 'año' : 'años', n => n === 1 ? 'mes' : 'meses', ' y ', 'menos de 1 mes'],
  }[lang];
  const parts = [];
  if (y) parts.push(`${y} ${W[0](y)}`);
  if (m) parts.push(`${m} ${W[1](m)}`);
  return parts.length ? parts.join(W[2]) : W[3];
}

const fmtMonth = s => { const { y, m } = parseYM(s); return `${MONTHS[lang][m - 1]} ${y}`; };

  const groups = STACKS.map(g => {
    const rows = [...g.items].sort((a, b) => moOf(b) - moOf(a)).map((item, i) => {

/* ---------------- Currículo em PDF ----------------
   Monta um currículo a partir dos mesmos dados do site e usa a impressão do navegador
   (Salvar como PDF). Atualizou o site, o currículo sai atualizado. */
function renderCV() {
  const C = UI.cv;
  // Datas no formato do currículo original: "Ago/2025" (PT/ES) e "Aug 2025" (EN)
  const cvMonth = ym => { const { y, m } = parseYM(ym); const mo = MONTHS[lang][m - 1]; const cap = mo[0].toUpperCase() + mo.slice(1); return lang === 'en' ? `${cap} ${y}` : `${cap}/${y}`; };
  const period = j => `${cvMonth(j.start)} – ${j.end ? cvMonth(j.end) : t(C.present)}`;
  const sec = (title, body) => `<section><h2>${t(title)}</h2>${body}</section>`;

  const summary = t(PROFILE.summary).replace('{certs}', ALL_COUNT()).replace('{hours}', fmtNum(ALL_HOURS()));

  const skills = C.groups.map(([label, idx, extra]) => {
    const items = idx.flatMap(i => HARD[i][1]).map(t);
    if (extra === 'mgmt') items.push(...MGMT.map(m => t(m[0])));
    return `<p><b>${t(label)}:</b> ${[...new Set(items)].join(', ')}</p>`;
  }).join('') + `<p><b>${t(C.langs)}:</b> ${LANGUAGES.map(l => `${t(l.name)} (${t(l.levelName).toLowerCase()})`).join(' · ')}</p>`;

  const jobs = JOBS.map(j => `<div class="cv-item">
    <h3>${t(j.role)}</h3><p class="cv-meta">${j.company} &nbsp;|&nbsp; ${period(j)}</p>
    <ul>${j.work.map(w => `<li>${jobItem(j, w, true, cvMonth)}</li>`).join('')}</ul>
  </div>`).join('');

  const edu = EDUCATION.map(e => {
    const years = e.status === 'progress' ? `${e.startYear} – ${t(C.present)}` : e.years.replace('—', '–');
    return `<div class="cv-item">
      <h3>${t(e.title)}</h3><p class="cv-meta">${e.short || e.inst} &nbsp;|&nbsp; ${years}</p>
      ${e.cvBullets ? `<ul>${e.cvBullets.map(b => `<li>${t(b)}</li>`).join('')}</ul>` : ''}
    </div>`;
  }).join('');

  const pro = STACKS.slice(0, 4).flatMap(g => g.items).filter(i => i[2] === 'pro').map(i => t(i[0]));
  const courses = `<ul>
    <li>${t(C.paths)} ${new Intl.ListFormat(HTML_LANG[lang], { type: 'conjunction' }).format(COURSES.map(c => t(c.name)))} – Alura &nbsp;|&nbsp; ${ALURA_COUNT()} ${t(C.certs)} &nbsp;|&nbsp; ${fmtNum(ALURA_HOURS())} ${t(C.hours)}</li>
    ${UDEMY.map(u => `<li>${u.title} – Udemy &nbsp;|&nbsp; ${fmtNum(u.hours)}h</li>`).join('')}
  </ul>
  <p>${t(C.continuous)}: ${pro.join(', ')}, ${t(C.continuousTail)}.</p>`;

  return `<header>
      <h1>${PROFILE.first} ${PROFILE.last}</h1>
      <p class="cv-role">${t(PROFILE.title)} &nbsp;|&nbsp; ${PROFILE.stacks.join(' · ')}</p>
      <p>${t(C.location)} &nbsp;|&nbsp; ${PROFILE.phone} &nbsp;|&nbsp; ${PROFILE.email}</p>
      <p>Portfolio: <a href="${PROFILE.site}">${PROFILE.site.replace('https://', '')}</a> &nbsp;|&nbsp; GitHub: <a href="${PROFILE.github}">${PROFILE.github.replace('https://', '')}</a> &nbsp;|&nbsp; LinkedIn: <a href="${PROFILE.linkedin}">${PROFILE.linkedin.replace('https://www.', '')}</a></p>
    </header>`
    + sec(C.summary, `<p>${summary}</p>`)
    + sec(C.skills, skills)
    + sec(C.exp, jobs)
    + sec(C.edu, edu)
    + sec(C.courses, courses);
}

}

/* ---------------- Animações ao rolar ---------------- */
// Guarda o índice dos elementos já revelados para que trocar o idioma não refaça as animações
const revealed = new Set();
let revealObserver;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');

function countUp(el) {
  const target = +el.dataset.count;
  if (reduceMotion.matches || !target) return;
  const t0 = performance.now(), dur = 1200;
  const step = ts => {
    const p = Math.min(1, (ts - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  el.textContent = '0';
  requestAnimationFrame(step);
}

function observeReveal() {
  if (revealObserver) revealObserver.disconnect();
  const els = [...document.querySelectorAll('.rv')];
  if (!('IntersectionObserver' in window)) { els.forEach(el => el.classList.add('in')); return; }
  revealObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('in');
      revealed.add(e.target.dataset.rk);
      e.target.querySelectorAll('[data-count]').forEach(countUp);
      revealObserver.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -8% 0px', threshold: 0.08 });
  els.forEach((el, i) => {
    el.dataset.rk = i;
    if (revealed.has(String(i))) el.classList.add('in', 'now');
    else revealObserver.observe(el);
  });
}

// Barra de progresso de leitura no topo
let progressTick = false;
function updateProgress() {
  const bar = document.querySelector('.progress i');
  if (!bar) return;
  const max = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${max > 0 ? Math.min(1, scrollY / max) : 0})`;
}
addEventListener('scroll', () => {
  if (progressTick) return;
  progressTick = true;
  requestAnimationFrame(() => { updateProgress(); progressTick = false; });
}, { passive: true });

/* ---------------- Tema ---------------- */
function currentTheme() {
  const a = document.documentElement.getAttribute('data-theme');
  if (a) return a;
  return matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
function toggleTheme() {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  // A escolha manual fica salva no navegador (localStorage) e vale nas próximas visitas
  document.documentElement.setAttribute('data-theme', next);
  store.set('theme', next);
  const btn = document.querySelector('[data-theme-toggle]');
  if (btn) btn.innerHTML = next === 'dark' ? ICON.sun : ICON.moon;
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  const btn = document.querySelector('[data-theme-toggle]');
  if (btn) btn.innerHTML = currentTheme() === 'dark' ? ICON.sun : ICON.moon;
});

/* ---------------- Navegação ativa ---------------- */
let observer;
function observeSections() {
  if (observer) observer.disconnect();
  const links = [...document.querySelectorAll('.links a')];
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      links.forEach(a => {
        const on = a.dataset.sec === e.target.id;
        a.classList.toggle('on', on);
        if (on) {
          a.setAttribute('aria-current', 'true');
          // No mobile a barra de links rola na horizontal: mantém o link ativo visível
          const bar = a.parentElement;
          if (bar.scrollWidth > bar.clientWidth) bar.scrollTo({ left: a.offsetLeft - bar.clientWidth / 2 + a.offsetWidth / 2, behavior: 'smooth' });
        }
        else a.removeAttribute('aria-current');
      });
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  document.querySelectorAll('main section[id]').forEach(s => observer.observe(s));
}

/* ---------------- Seletor de idioma ---------------- */
const langBtn = () => document.querySelector('[data-lang-btn]');
const langMenu = () => document.querySelector('.lang-menu');
function openLang() {
  langMenu().hidden = false;
  langBtn().setAttribute('aria-expanded', 'true');
  langMenu().querySelector('[aria-selected="true"]').focus();
}
function closeLang(focusBtn) {
  const m = langMenu();
  if (!m || m.hidden) return;
  m.hidden = true;
  langBtn().setAttribute('aria-expanded', 'false');
  if (focusBtn) langBtn().focus();
}
function chooseLang(l) {
  if (l !== lang) { lang = l; store.set('lang', lang); render(); }
  else closeLang();
  langBtn().focus();
}

/* ---------------- Eventos ---------------- */
document.addEventListener('click', e => {
  if (e.target.closest('[data-lang-btn]')) { langMenu().hidden ? openLang() : closeLang(); return; }
  const opt = e.target.closest('.lang-menu [data-lang]');
  if (opt) { chooseLang(opt.dataset.lang); return; }
  if (!e.target.closest('.lang')) closeLang();
  if (e.target.closest('[data-theme-toggle]')) toggleTheme();
  if (e.target.closest('[data-cv]')) downloadCV();
  const sh = e.target.closest('[data-shelf]');
  if (sh) { const el = document.getElementById(sh.dataset.shelf); el.scrollBy({ left: +sh.dataset.dir * el.clientWidth * .8, behavior: 'smooth' }); return; }
  const more = e.target.closest('[data-more]');
  if (more) {
    const id = more.dataset.more, box = document.getElementById(id);
    const open = !expanded.has(id);
    open ? expanded.add(id) : expanded.delete(id);
    box.classList.toggle('open', open);
    more.setAttribute('aria-expanded', open);
    if (!open && box.getBoundingClientRect().top < 0) box.scrollIntoView({ block: 'start' });
  }
});

document.addEventListener('keydown', e => {
  if (e.target.matches('[data-lang-btn]') && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); openLang(); return; }
  const opt = e.target.closest('.lang-menu [data-lang]');
  if (!opt) return;
  const opts = [...langMenu().querySelectorAll('[data-lang]')];
  const i = opts.indexOf(opt);
  if (e.key === 'ArrowDown') { e.preventDefault(); opts[(i + 1) % opts.length].focus(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); opts[(i - 1 + opts.length) % opts.length].focus(); }
  else if (e.key === 'Home') { e.preventDefault(); opts[0].focus(); }
  else if (e.key === 'End') { e.preventDefault(); opts[opts.length - 1].focus(); }
  else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); chooseLang(opt.dataset.lang); }
  else if (e.key === 'Escape') { e.preventDefault(); closeLang(true); }
  else if (e.key === 'Tab') closeLang();
});

render();

// Recalcula as durações quando o mês vira (página aberta por muito tempo)
let lastMonth = now().getMonth();
setInterval(() => { if (now().getMonth() !== lastMonth) { lastMonth = now().getMonth(); render(); } }, 60 * 60 * 1000);
</script>
